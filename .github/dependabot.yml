version: 2
# Bewusst zurückhaltend: dieses Repo wird gepflegt, nicht bewacht. Ein Schwall
# einzelner PRs wird ignoriert und ist damit schlechter als monatlich einer.
# Major-Sprünge bei Runtimes und Toolchain sind ausgenommen — genau die haben
# schon einmal die CI zerlegt (TypeScript 7, Node 26, Python 3.14).
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]