name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: MCP stdio smoke (real client round trip)
        run: node scripts/stdio-smoke.mjs

      - name: MCP stdio smoke with tracing enabled
        # stdout is the protocol stream. A span exporter that printed there
        # would corrupt every message, so the round trip is repeated with
        # tracing on and nothing listening on the endpoint.
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
        run: node scripts/stdio-smoke.mjs
