name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: MCP stdio smoke (real client round trip)
        run: node scripts/stdio-smoke.mjs

      - name: MCP stdio smoke with tracing enabled
        # stdout is the protocol stream. A span exporter that printed there
        # would corrupt every message, so the round trip is repeated with
        # tracing on and nothing listening on the endpoint.
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
        run: node scripts/stdio-smoke.mjs
